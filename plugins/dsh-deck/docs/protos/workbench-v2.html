<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>dsh-deck · 工作台 v2（主线原型 · 全动线可操作）</title>
<style>
* { box-sizing:border-box; margin:0; }
html,body { height:100%; }
body { font:16px/1.7 system-ui,'Segoe UI',sans-serif;
  --bg:#050a18; --panel:rgba(120,190,255,.06); --panel2:rgba(120,190,255,.10);
  --line:rgba(140,200,255,.16); --line2:rgba(140,200,255,.30); --ink:#e3f0ff; --ink2:#8fa8cc;
  --acc:#2dd4ff; --acc2:#6366f1; --grad:linear-gradient(135deg,#2dd4ff,#6366f1);
  --ok:#34d399; --warn:#fbbf24; --busy:#60a5fa; color:var(--ink); background:var(--bg); overflow:hidden; }
.aur { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.aur i { position:absolute; border-radius:50%; filter:blur(90px); opacity:.8; }
.aur i:nth-child(1){width:56vw;height:56vw;left:-10vw;top:-22vw;background:rgba(45,212,255,.15);}
.aur i:nth-child(2){width:48vw;height:48vw;right:-12vw;top:6vw;background:rgba(99,102,241,.13);}
.grid-bg { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.3;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px); background-size:56px 56px;
  mask-image:radial-gradient(1100px 700px at 50% 20%,#000 30%,transparent 75%); }
.glass { position:relative; background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015)),var(--panel); border:1px solid var(--line); border-radius:18px; backdrop-filter:blur(18px); box-shadow:0 14px 44px rgba(0,0,0,.45); }
.app { position:relative; z-index:1; display:flex; height:100vh; }
.btn-pri { background:var(--grad); color:#fff; border:none; border-radius:11px; padding:10px 24px; font:700 15px system-ui; cursor:pointer; box-shadow:0 5px 18px rgba(45,212,255,.3); }
.btn-pri:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
.btn-gho { background:none; border:1px solid var(--line2); color:var(--ink); border-radius:11px; padding:10px 22px; font:15px system-ui; cursor:pointer; }
.btn-mini { background:var(--panel2); border:1px solid var(--line); color:var(--acc); border-radius:8px; padding:5px 13px; font-size:13px; cursor:pointer; }
.h1 { font-size:21px; font-weight:750; } .hint { font-size:13px; color:var(--ink2); }

.rail { width:84px; background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--panel); border-right:1px solid var(--line); backdrop-filter:blur(18px); display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 0; }
.rail .brand { font-weight:800; font-size:12px; letter-spacing:3px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; padding:8px 0 14px; }
.rbtn { width:60px; padding:9px 0 7px; display:flex; flex-direction:column; align-items:center; background:none; border:none; border-radius:14px; color:var(--ink); opacity:.5; cursor:pointer; position:relative; }
.rbtn:hover { opacity:.9; background:var(--panel); }
.rbtn.on { opacity:1; background:var(--panel2); box-shadow:inset 0 0 0 1px var(--line2), 0 0 18px rgba(45,212,255,.18); }
.rbtn .i { font-size:22px; } .rbtn .t { font-size:11.5px; }
.rbadge { position:absolute; top:4px; right:4px; background:#ff3d5e; color:#fff; font-size:10px; border-radius:999px; padding:0 6px; font-weight:700; }

.main { flex:1; min-width:0; display:flex; flex-direction:column; padding:18px 24px 16px; }
.bar { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.zone { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:18px; padding-bottom:20px; }
.band { display:flex; flex-direction:column; gap:10px; }
.bhead { display:flex; align-items:center; gap:10px; font-size:14.5px; font-weight:700; }
.bhead .n { background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:0 12px; font-size:12.5px; color:var(--ink2); }
.todo-card { display:flex; align-items:center; gap:16px; padding:15px 22px; }
.todo-card.urgent { border-color:rgba(251,191,36,.5); background:linear-gradient(145deg,rgba(251,191,36,.11),transparent 60%),var(--panel); box-shadow:0 8px 30px rgba(251,191,36,.1); }
.todo-card .ico { font-size:26px; }
.todo-card .nm { font-size:16.5px; font-weight:700; }
.todo-card .pv { flex:1; font-size:14.5px; color:var(--ink2); border-left:2px solid var(--line); padding-left:16px; }
.flows { display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:12px; }
.flow { padding:14px 18px; }
.flow .ft { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.flow .ft b { font-size:15px; }
.flow .fgo { margin-left:auto; flex-shrink:0; }
.flow.done-card { opacity:.6; }
.stp { display:flex; align-items:center; }
.s { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink2); white-space:nowrap; }
.s i { width:18px; height:18px; border-radius:50%; border:1.5px solid var(--line2); display:flex; align-items:center; justify-content:center; font-style:normal; font-size:10px; }
.s.done i { border-color:var(--ok); color:var(--ok); }
.s.now { color:var(--acc); font-weight:650; }
.s.now i { background:var(--grad); color:#fff; border-color:transparent; box-shadow:0 0 10px rgba(45,212,255,.5); }
.ln { flex:1; height:1px; background:var(--line); margin:0 7px; min-width:14px; }
.ln.done { background:var(--ok); }
.ideas-strip { display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; }
.idea { min-width:270px; max-width:270px; padding:13px 16px; }
.idea.used { opacity:.45; }
.idea b { font-size:14.5px; display:block; }
.idea .src { font-size:12px; color:var(--ink2); margin-top:4px; font-family:ui-monospace,monospace; }
.idea .act { display:flex; gap:7px; margin-top:10px; }

/* ═══ 审阅/发布 浮层 ═══ */
.sheet-back { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20; display:flex; align-items:center; justify-content:center; }
.sheet-back[hidden] { display:none; }
.sheet { width:min(880px,92vw); max-height:86vh; overflow:auto; padding:26px 30px; display:flex; flex-direction:column; gap:14px; }
.sheet .st { display:flex; align-items:center; gap:12px; }
.sheet .st b { font-size:19px; }
.jrow { display:flex; gap:14px; align-items:flex-start; background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:14px 18px; cursor:pointer; transition:.13s; }
.jrow:hover { border-color:var(--line2); }
.jrow.on { border-color:var(--acc); background:linear-gradient(145deg,rgba(45,212,255,.12),transparent),var(--panel); }
.jrow .no { font-family:ui-monospace,monospace; font-size:12px; color:var(--ink2); padding-top:4px; }
.jrow .box { width:24px; height:24px; border-radius:8px; border:2px solid var(--line2); flex-shrink:0; margin-top:2px; }
.jrow.on .box { background:var(--grad); border-color:transparent; }
.jrow .tx { font-size:16px; line-height:1.65; }
.sheet .foot { display:flex; align-items:center; gap:14px; border-top:1px solid var(--line); padding-top:14px; }
.platchips { display:flex; gap:9px; }
.plat { border:1px solid var(--line2); border-radius:999px; padding:5px 18px; cursor:pointer; font-size:14px; color:var(--ink2); }
.plat.on { background:var(--grad); color:#fff; border-color:transparent; }
.pf-text { background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:12px 15px; font:13.5px/1.7 ui-monospace,monospace; color:var(--ink); white-space:pre-wrap; }

/* ═══ 右栏（高度修复：列表自适应 34vh 上限 + 可整块折叠）═══ */
.divider { width:7px; cursor:col-resize; position:relative; flex-shrink:0; }
.divider::after { content:''; position:absolute; left:3px; top:0; bottom:0; width:1px; background:var(--line); }
.divider:hover::after, .divider.drag::after { width:3px; background:var(--acc); box-shadow:0 0 12px rgba(45,212,255,.4); }
.dock { width:400px; min-width:300px; max-width:46vw; flex-shrink:0; background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--panel); border-left:1px solid var(--line); backdrop-filter:blur(18px); display:flex; flex-direction:column; }
.dock.hide { display:none; }
.dh { height:50px; display:flex; align-items:center; gap:10px; padding:0 14px; border-bottom:1px solid var(--line); flex-shrink:0; }
.dh .dot { width:10px; height:10px; border-radius:50%; background:var(--grad); box-shadow:0 0 10px rgba(45,212,255,.8); }
.dh b { font-size:15px; flex:1; }
.dh button { background:none; border:1px solid var(--line); color:var(--ink2); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:12.5px; }
.dh button:hover { border-color:var(--acc); color:var(--acc); }
.sfold { display:flex; align-items:center; gap:8px; padding:8px 14px 0; cursor:pointer; font-size:12px; color:var(--ink2); flex-shrink:0; user-select:none; }
.sfold:hover { color:var(--acc); }
.sessions { border-bottom:1px solid var(--line); padding:9px 10px 10px; display:flex; flex-direction:column; gap:6px; flex-shrink:0; overflow:auto; max-height:34vh; }
.sessions.fold { display:none; }
.sgrp { font-size:11px; color:var(--ink2); margin:4px 4px 1px; font-family:ui-monospace,monospace; letter-spacing:1px; }
.sess { display:flex; align-items:center; gap:9px; background:var(--panel2); border:1px solid transparent; border-radius:11px; padding:9px 12px; cursor:pointer; transition:.14s; }
.sess:hover { border-color:var(--line2); }
.sess.on { border-color:var(--acc); background:linear-gradient(145deg,rgba(45,212,255,.12),transparent),var(--panel2); box-shadow:0 0 16px rgba(45,212,255,.15); }
.sess .si { flex:1; min-width:0; }
.sess .st { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sess .sp { font-size:11.5px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sbadge { font-size:11px; border-radius:999px; padding:1px 9px; border:1px solid; white-space:nowrap; flex-shrink:0; }
.sbadge.run { color:var(--busy); border-color:rgba(96,165,250,.5); background:rgba(96,165,250,.1); animation:br 1.8s infinite; }
.sbadge.need { color:var(--warn); border-color:rgba(251,191,36,.5); background:rgba(251,191,36,.1); }
.sbadge.run { color:var(--busy); border-color:rgba(96,165,250,.5); background:rgba(96,165,250,.1); animation:br 1.8s infinite; }
.sbadge.need { color:var(--warn); border-color:rgba(251,191,36,.5); background:rgba(251,191,36,.1); }
.sbadge.idle { color:var(--ink2); border-color:var(--line2); }
.unread-dot { width:9px; height:9px; border-radius:50%; background:#ff3d5e; box-shadow:0 0 8px #ff3d5e; flex-shrink:0; animation:br 1.6s infinite; }
@keyframes br { 50% { opacity:.55; } }
.srt { font-family:ui-monospace,monospace; font-size:11px; color:var(--busy); flex-shrink:0; }
.dbody { flex:1; overflow:auto; padding:15px; display:flex; flex-direction:column; gap:11px; min-height:120px; }
.bub { padding:10px 13px; border-radius:13px; font-size:14px; max-width:88%; line-height:1.65; }
.bub.me { align-self:flex-end; background:var(--grad); color:#fff; }
.bub.ai { background:var(--panel2); border:1px solid var(--line); }
.bub .mini-acts { display:flex; gap:7px; margin-top:9px; }
.dinput { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); flex-shrink:0; }
.dinput input { flex:1; background:color-mix(in srgb,var(--bg) 60%,transparent); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:10px 13px; font:14.5px system-ui; outline:none; }
.dinput input:focus { border-color:var(--acc); }
.toast { position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(16px); background:var(--panel2); border:1px solid var(--line2); color:var(--ink); border-radius:13px; padding:10px 20px; font-size:14px; opacity:0; pointer-events:none; transition:.22s; z-index:40; }
.toast.show { opacity:1; transform:translateX(-50%); }
.reopen { position:fixed; right:14px; top:14px; z-index:5; display:none; }
</style>
</head>
<body>
<div class="aur"><i></i><i></i></div>
<div class="grid-bg"></div>
<div class="app">
  <div class="rail">
    <div class="brand">DECK</div>
    <button class="rbtn on"><span class="i">🏠</span><span class="t">总台</span><span class="rbadge" id="rbadge">2</span></button>
    <button class="rbtn"><span class="i">🎬</span><span class="t">内容台</span></button>
    <button class="rbtn"><span class="i">🧠</span><span class="t">知识库</span></button>
    <button class="rbtn"><span class="i">📡</span><span class="t">调研台</span></button>
    <button class="rbtn"><span class="i">💬</span><span class="t">消息台</span></button>
  </div>

  <div class="main">
    <div class="bar">
      <div class="h1">总台</div>
      <span class="hint">完整动线可操作：审阅落库 / 发布点发 / 灵感升任务——状态实时流转</span>
    </div>
    <div class="zone">
      <div class="band" id="todo-band"></div>
      <div class="band">
        <div class="bhead">🔁 进行中的件 <span class="n" id="flow-n"></span></div>
        <div class="flows" id="flows"></div>
      </div>
      <div class="band">
        <div class="bhead">💡 灵感流 <span class="n" id="idea-n"></span></div>
        <div class="ideas-strip" id="ideas"></div>
      </div>
    </div>
  </div>

  <div class="divider" id="dv" title="拖动调宽度 · 双击复位"></div>

  <div class="dock" id="dock">
    <div class="dh">
      <span class="dot"></span><b>dsh 对话</b>
      <button onclick="newSess()">＋ 新会话</button>
      <button onclick="hideDock()">⟩⟩ 收起</button>
    </div>
    <div class="sfold" onclick="document.getElementById('sessbox').classList.toggle('fold'); this.firstElementChild.textContent = document.getElementById('sessbox').classList.contains('fold') ? '▸' : '▾'"><span>▾</span> 会话列表</div>
    <div class="sessions" id="sessbox"></div>
    <div class="dbody" id="dbody"></div>
    <div class="dinput"><input id="din" placeholder="发给 agent…"><button class="btn-pri" style="padding:9px 18px" onclick="send()">↑</button></div>
  </div>
</div>

<!-- 审阅浮层 -->
<div class="sheet-back" id="revSheet" hidden>
  <div class="sheet glass">
    <div class="st"><span class="sbadge need">👀 待审阅</span><b>调研：GLM-5 发布后的市场反馈</b><span style="flex:1"></span><button class="btn-gho" style="padding:7px 16px;font-size:13.5px" onclick="closeSheet('revSheet')">关闭</button></div>
    <div class="hint">勾选要落库的判断 → 追加 LESSONS「十、Deck 落库」+ git 提交</div>
    <div id="jlist" style="display:flex;flex-direction:column;gap:9px"></div>
    <div class="foot">
      <button class="btn-pri" id="sinkBtn" onclick="doSink()" disabled>📥 落库选中 0 条</button>
      <span class="hint">落库后：任务置完成 · 待办消除 · agent 收到确认</span>
    </div>
  </div>
</div>

<!-- 发布浮层 -->
<div class="sheet-back" id="pubSheet" hidden>
  <div class="sheet glass" style="width:min(680px,92vw)">
    <div class="st"><span class="sbadge" style="color:var(--ok);border-color:var(--ok)">📢 发布终审</span><b>📊 一页看懂 dsh 插件开发</b><span style="flex:1"></span><button class="btn-gho" style="padding:7px 16px;font-size:13.5px" onclick="closeSheet('pubSheet')">关闭</button></div>
    <div>
      <div class="hint" style="margin-bottom:8px">① 选平台</div>
      <div class="platchips" id="plats"></div>
    </div>
    <div>
      <div class="hint" style="margin-bottom:8px">② 预填文本（已生成）</div>
      <div class="pf-text" id="pftext"></div>
    </div>
    <div class="foot">
      <button class="btn-pri" id="pubBtn" onclick="doPublish()" disabled>③ 我已确认，点下发布 ✓</button>
      <span class="hint" id="pubWhy">先在 ① 选一个平台</span>
    </div>
  </div>
</div>

<button class="btn-mini reopen" id="reopen" onclick="showDock()">💬 展开对话</button>
<div class="toast" id="toast"></div>

<script>
// ═══ 状态（单一数据源，动线改的就是这些）═══
const S = {
  todos: [
    { id:'rev', ico:'🧾', nm:'审阅落库', pv:'T-02 已交活：3 条判断待勾选 → LESSONS', act:'去审阅' },
    { id:'pub', ico:'📢', nm:'发布终审', pv:'「一页看懂 dsh 插件开发」微博预填就绪——你点发', act:'去点发' },
  ],
  flows: [
    { id:'f1', t:'📊 竞品周报 #12', hint:'PPT · agent 干活中 12:34', step:2 },
    { id:'f2', t:'📊 一页看懂 dsh 插件开发', hint:'等你点发', step:3 },
    { id:'f3', t:'📝 插件避坑清单', hint:'草稿就绪', step:3 },
  ],
  ideas: [
    { id:'i1', t:'把「评论高赞」做成固定选题栏目', src:'来源：对话 · 08-25', acts:['升任务','推知识库','推调研台'], used:false },
    { id:'i2', t:'抖音 AI 配音功能值得测', src:'来源：调研 · 08-25', acts:['升任务','推调研台'], used:false },
    { id:'i3', t:'重读《心智社会》做读书笔记', src:'来源：阅读 · 08-24', acts:['推知识库'], used:false },
  ],
  judgments: [
    'GLM-5 舆论反馈以正面为主，长上下文与 Agent 编排能力是被引用最多的差异化点',
    '开发者生态位（开放权重、本地可跑）是口碑护城河，本地部署教程出现速度可作生态热度代理指标',
    '价格仍是中文社区第二落点，「性价比」叙事在 X 与微博两边都成立',
  ],
  picked: {}, pubPlat: null,
}
const STEPS = ['灵感','任务','创作','待发','发布']

function render() {
  document.getElementById('todo-band').innerHTML = S.todos.length === 0
    ? `<div class="bhead">✅ 今日待办清空 <span class="n">0</span></div><div class="hint" style="padding:0 4px">全部处理完——agent 会话继续在右栏干活</div>`
    : `<div class="bhead">🙋 待你决定 <span class="n">${S.todos.length}</span></div>` + S.todos.map(t => `
      <div class="todo-card glass urgent"><span class="ico">${t.ico}</span><span class="nm">${t.nm}</span>
        <span class="pv">${t.pv}</span><button class="btn-pri" onclick="todoAct('${t.id}')">${t.act}</button></div>`).join('')
  const rb = document.getElementById('rbadge')
  rb.textContent = S.todos.length; rb.style.display = S.todos.length === 0 ? 'none' : ''
  const active = S.flows.filter(f => f.step < 4)
  document.getElementById('flow-n').textContent = active.length
  document.getElementById('flows').innerHTML = S.flows.map(f => {
    const done = f.step >= 4
    const goBtn = f.step === 1
      ? `<button class="btn-mini fgo" onclick="dispatchFlow('${f.id}')">🚀 发给 agent</button>`
      : f.step === 3
        ? `<button class="btn-mini fgo" onclick="openPub('${f.id}')">📢 去发布</button>`
        : ''
    return `<div class="flow glass ${done ? 'done-card' : ''}"><div class="ft"><b>${f.t}</b>${goBtn || `<span class="hint" style="margin-left:auto">${done ? '✅ 已发布' : f.hint}</span>`}</div>
      <div class="stp">${STEPS.map((s, i) => {
        const cls = i < f.step ? 'done' : i === f.step ? 'now' : ''
        const ln = i < f.step ? 'done' : ''
        return `<span class="s ${cls}"><i>${i < f.step ? '✓' : i + 1}</i>${s}</span>${i < 4 ? `<span class="ln ${ln}"></span>` : ''}`
      }).join('')}</div></div>`
  }).join('')
  document.getElementById('idea-n').textContent = S.ideas.filter(i => !i.used).length
  document.getElementById('ideas').innerHTML = S.ideas.map(i => `
    <div class="idea glass ${i.used ? 'used' : ''}"><b>${i.t}</b><div class="src">${i.src}${i.used ? ' · 已流转' : ''}</div>
      ${i.used ? '' : `<div class="act">${i.acts.map(a => `<button class="btn-mini" onclick="ideaAct('${i.id}','${a}')">${a}</button>`).join('')}</div>`}</div>`).join('')
}

function todoAct(id) { if (id === 'rev') openRev(); if (id === 'pub') openPub() }
function closeSheet(id) { document.getElementById(id).hidden = true }
function openRev() {
  S.picked = {}
  document.getElementById('jlist').innerHTML = S.judgments.map((j, i) => `
    <div class="jrow" id="j${i}" onclick="pickJ(${i})"><span class="no">0${i + 1}</span><span class="box"></span><span class="tx">${j}</span></div>`).join('')
  updSink()
  document.getElementById('revSheet').hidden = false
}
function pickJ(i) { S.picked[i] = !S.picked[i]; document.getElementById('j' + i).classList.toggle('on', S.picked[i]); updSink() }
function updSink() {
  const n = Object.values(S.picked).filter(Boolean).length
  const b = document.getElementById('sinkBtn'); b.textContent = `📥 落库选中 ${n} 条`; b.disabled = n === 0
}
function doSink() {
  const n = Object.values(S.picked).filter(Boolean).length
  S.todos = S.todos.filter(t => t.id !== 'rev')
  closeSheet('revSheet'); render()
  toast(`✓ 已落库 ${n} 条 → LESSONS「十、Deck 落库」+ git 提交 · 任务置完成`)
  aiSay(`T-02 审阅通过，${n} 条判断已入 LESSONS。剩 1 条发布待你点发。`)
}
function openPub(fid) {
  S.pubPlat = null; S.pubFlow = fid || 'f2'
  const f = S.flows.find(x => x.id === S.pubFlow)
  document.querySelector('#pubSheet .st b').textContent = f ? f.t : ''
  document.getElementById('plats').innerHTML = ['微博','X','公众号'].map(p => `<span class="plat" data-p="${p}" onclick="pickP('${p}')">${p}</span>`).join('')
  document.getElementById('pftext').textContent = ''
  document.getElementById('pubBtn').disabled = true
  document.getElementById('pubSheet').hidden = false
}
function pickP(p) {
  S.pubPlat = p
  document.querySelectorAll('.plat').forEach(e => e.classList.toggle('on', e.dataset.p === p))
  document.getElementById('pftext').textContent = `【${p} · 预填已生成】\n一页看懂 dsh 插件开发：两半结构 + 五步工作流 + 接单协议。\n（预填页已打开——最后一步你来点）`
  document.getElementById('pubBtn').disabled = false
  document.getElementById('pubWhy').textContent = '预填页在新标签打开 · 最后一步永远人工点发'
}
function doPublish() {
  S.todos = S.todos.filter(t => t.id !== 'pub')
  const f = S.flows.find(x => x.id === (S.pubFlow || 'f2')); if (f) { f.step = 5; f.hint = '' }
  closeSheet('pubSheet'); render()
  toast(`✓ 已记录发布（${S.pubPlat}）→ 发布记录.md · 状态 → 已发布`)
  aiSay(`「${(f && f.t) || '内容'}」已发布 ✓ 记录已回写。`)
}
function ideaAct(id, act) {
  const i = S.ideas.find(x => x.id === id); i.used = true
  if (act === '升任务') {
    S.flows.unshift({ id:'f' + Date.now(), t:'📋 ' + i.t, hint:'待派发 agent', step:1 })
    toast('✓ 已升任务 → 进入「进行中的件」，点卡片上的「🚀 发给 agent」派活')
    aiSay(`灵感「${i.t}」已立任务卡，点卡片上的「🚀 发给 agent」就能派活。`)
  } else if (act === '推知识库') { toast('✓ 已推知识库 → 采集层') }
  else { toast('✓ 已推调研台') }
  render()
}

/** 流程卡下一步：发给 agent（任务→创作，工作会话开始干活） */
function dispatchFlow(fid) {
  const f = S.flows.find(x => x.id === fid); if (!f || f.step !== 1) return
  f.step = 2; f.hint = 'agent 干活中 00:01'
  render()
  toast('✓ 已派发给「PPT：竞品周报」工作会话（右栏）')
  CONV.b.push(['ai', `已接单：${f.t.replace('📋 ', '')}。按验收干活中，交活后总台会出现审阅待办。`])
  markUnread('b'); if (cur === 'b') renderConv()
}

// ═══ 右栏多会话 ═══
const GROUPS = [
  { g:'当前工作区', list: [
    { id:'a', t:'主对话 · agent 总管', p:'今天动线：2 待办、3 进行中', st:'idle' },
    { id:'b', t:'PPT：竞品周报 #12', p:'正在按验收条目干活；结论带来源', st:'run', rt:'12:34' },
  ]},
  { g:'其他工作区', list: [
    { id:'c', t:'安全审计', p:'需要你确认：产物放 content/B/？', st:'need' },
    { id:'d', t:'coding', p:'（空闲）上次：跑数据回流脚本', st:'idle' },
  ]},
]
const META = { run:['🏃','run'], need:['🙋','need'], idle:['💤','idle'] }
let cur = 'a'
const CONV = {
  a: [['ai','早，今天有 2 条待办：审阅落库 + 发布终审。先处理哪个？']],
  b: [['ai','已接单：竞品周报 #12（PPT）。按验收：逐页标题+要点≤5+可预览 html。'],['ai','大纲 P1-P6 已完成，正在排版 P3 表格页…']],
  c: [['ai','需要你确认：产物放 content/B/ 还是新建 content/exp-b/？']],
  d: [],
}
function renderSess() {
  document.getElementById('sessbox').innerHTML = GROUPS.map(G =>
    `<div class="sgrp">${G.g}</div>` + G.list.map(s => `
    <div class="sess ${s.id === cur ? 'on' : ''}" onclick="pick('${s.id}')">
      ${s.unread && s.id !== cur ? '<span class="unread-dot" title="有新消息"></span>' : ''}
      <span class="si"><div class="st">${s.t}</div><div class="sp">${s.p}</div></span>
      ${s.rt ? `<span class="srt">${s.rt}</span>` : ''}
      <span class="sbadge ${META[s.st][1]}">${META[s.st][0]}</span>
    </div>`).join('')).join('')
    + '<button class="btn-mini" style="align-self:flex-start;margin:4px 4px 2px" onclick="newSess()">＋ 新建会话</button>'
}
function renderConv() {
  const c = CONV[cur] || []
  document.getElementById('dbody').innerHTML = c.length === 0
    ? '<div class="hint" style="text-align:center;margin-top:30px">（空会话——发第一条消息）</div>'
    : c.map(m => `<div class="bub ${m[0]}">${m[1]}</div>`).join('')
}
function pick(id) { cur = id; clearUnread(id); renderSess(); renderConv() }
function newSess() { const id = 'n' + Date.now(); GROUPS[0].list.push({ id, t: '新会话 · ' + new Date().toTimeString().slice(0,5), p: '（新）', st: 'idle' }); CONV[id] = []; pick(id) }
function markUnread(id) { for (const G of GROUPS) { const s = G.list.find(x => x.id === id); if (s) { s.unread = true } } renderSess() }
function clearUnread(id) { for (const G of GROUPS) { const s = G.list.find(x => x.id === id); if (s) s.unread = false } }
function send() {
  const el = document.getElementById('din'); const v = el.value.trim(); if (!v) return
  CONV[cur].push(['me', v]); el.value = ''; renderConv()
  setTimeout(() => { CONV[cur].push(['ai', '收到。']); renderConv() }, 450)
}
function aiSay(t) { CONV.a.push(['ai', t]); if (cur === 'a') renderConv(); else markUnread('a') }
// 人因修复：回车发送、ESC/背景关浮层
document.getElementById('din').addEventListener('keydown', (e) => { if (e.key === 'Enter') send() })
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { document.getElementById('revSheet').hidden = true; document.getElementById('pubSheet').hidden = true } })
for (const id of ['revSheet', 'pubSheet']) {
  document.getElementById(id).addEventListener('click', (e) => { if (e.target.id === id) e.target.hidden = true })
}
const dv = document.getElementById('dv'), dock = document.getElementById('dock')
const saved = localStorage.getItem('dk-v2-dockw'); if (saved) dock.style.width = saved + 'px'
dv.addEventListener('pointerdown', (e) => { dv.classList.add('drag'); dv.setPointerCapture(e.pointerId)
  const mv = (ev) => { dock.style.width = Math.min(innerWidth * .46, Math.max(300, innerWidth - ev.clientX)) + 'px' }
  const up = () => { dv.classList.remove('drag'); dv.removeEventListener('pointermove', mv); localStorage.setItem('dk-v2-dockw', dock.getBoundingClientRect().width) }
  dv.addEventListener('pointermove', mv); dv.addEventListener('pointerup', up) })
dv.addEventListener('dblclick', () => { dock.style.width = '400px'; localStorage.removeItem('dk-v2-dockw') })
function hideDock() { dock.classList.add('hide'); dv.style.display = 'none'; document.getElementById('reopen').style.display = 'block' }
function showDock() { dock.classList.remove('hide'); dv.style.display = ''; document.getElementById('reopen').style.display = 'none' }
let tt; function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400) }
render(); renderSess(); renderConv()
</script>
