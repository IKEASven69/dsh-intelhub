# dsh-trust-list bundle patch: insert the dependency trust list plugin into
# profile composition. host half is a TypertRemoteService (Client→Host RPC:
# audit/audit-fix/export-sarif/monitor-status/open-file/scan-installed-plugins);
# dep_audit model tool is registered in Service.init. Browser half ships via
# dsh.client manifest + exports["./client"].

- insert:
    - id: trust-list
      name: 'dsh-trust-list'
